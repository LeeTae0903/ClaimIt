services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimit
      POSTGRES_PASSWORD: claimit
      POSTGRES_DB: claimit
    ports:
      - "5432:5432"
    volumes:
      - claimit-postgres-data:/var/lib/postgresql/data

volumes:
  claimit-postgres-data:
